<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="topbar__title">
        <h1>Chat</h1>
        <p class="topbar__profile" id="active-profile-summary">Sin perfil activo</p>
      </div>
      <button class="topbar__button" id="profiles-open" type="button" aria-controls="profiles-view" aria-expanded="false">
        Perfiles
      </button>
    </header>

    <div class="chat" id="chat-view">
      <p class="loading-indicator" id="loading-indicator" hidden>Cargando mensajes...</p>

      <div class="error-state" id="error-state" hidden>
        <p>Ocurrió un error al cargar los mensajes.</p>
        <button id="retry-btn" type="button">Reintentar</button>
      </div>

      <main class="messages" id="messages"></main>

      <form class="composer" id="composer">
        <input id="composer-input" type="text" placeholder="Escribí un mensaje..." autocomplete="off" />
        <button type="submit">Enviar</button>
      </form>
    </div>

    <section class="profiles" id="profiles-view" hidden aria-labelledby="profiles-title">
      <div class="profiles__header">
        <div>
          <h2 id="profiles-title">Perfiles</h2>
          <p class="profiles__subtitle">Creá un perfil y elegí con cuál usar el chat.</p>
        </div>
        <button class="btn btn--ghost" id="profiles-back" type="button">Volver al chat</button>
      </div>

      <form class="profile-form" id="profile-form" novalidate>
        <div class="field">
          <label for="profile-name">Nombre</label>
          <input id="profile-name" name="name" type="text" maxlength="40" placeholder="Tu nombre" autocomplete="nickname" />
          <p class="field__error" id="profile-name-error" hidden></p>
        </div>

        <fieldset class="field avatar-field">
          <legend>Avatar</legend>
          <div class="avatar-picker">
            <label class="avatar-option" title="Sonriente">
              <input type="radio" name="avatar" value="🙂" checked aria-label="Avatar sonriente" />
              <span aria-hidden="true">🙂</span>
            </label>
            <label class="avatar-option" title="Gato">
              <input type="radio" name="avatar" value="🐱" aria-label="Avatar gato" />
              <span aria-hidden="true">🐱</span>
            </label>
            <label class="avatar-option" title="Zorro">
              <input type="radio" name="avatar" value="🦊" aria-label="Avatar zorro" />
              <span aria-hidden="true">🦊</span>
            </label>
            <label class="avatar-option" title="Oso panda">
              <input type="radio" name="avatar" value="🐼" aria-label="Avatar oso panda" />
              <span aria-hidden="true">🐼</span>
            </label>
            <label class="avatar-option" title="Cohete">
              <input type="radio" name="avatar" value="🚀" aria-label="Avatar cohete" />
              <span aria-hidden="true">🚀</span>
            </label>
            <label class="avatar-option" title="Luna">
              <input type="radio" name="avatar" value="🌙" aria-label="Avatar luna" />
              <span aria-hidden="true">🌙</span>
            </label>
            <label class="avatar-option" title="Auriculares">
              <input type="radio" name="avatar" value="🎧" aria-label="Avatar auriculares" />
              <span aria-hidden="true">🎧</span>
            </label>
            <label class="avatar-option" title="Persona programando">
              <input type="radio" name="avatar" value="🧑‍💻" aria-label="Avatar persona programando" />
              <span aria-hidden="true">🧑‍💻</span>
            </label>
          </div>
        </fieldset>

        <div class="field">
          <label for="profile-bio">Bio <span class="field__hint">(opcional, máx. 160)</span></label>
          <textarea id="profile-bio" name="bio" rows="3" maxlength="160" placeholder="Contá algo sobre vos..."></textarea>
          <p class="field__error" id="profile-bio-error" hidden></p>
        </div>

        <p class="profile-status" id="profile-status" role="status" hidden></p>
        <button class="btn btn--primary" type="submit">Guardar perfil</button>
      </form>

      <section class="profile-list-section" aria-labelledby="profile-list-title">
        <h3 id="profile-list-title">Tus perfiles</h3>
        <p class="profile-empty" id="profile-empty">Todavía no creaste ningún perfil.</p>
        <div class="profile-list" id="profile-list"></div>
      </section>
    </section>
  </div>

  <script type="module" src="src/views/appView.js"></script>
</body>
</html>
