<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tarjeta de perfil</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="card">
    <img class="card__avatar" src="https://i.pravatar.cc/150?img=47" alt="Foto de perfil de Ana García">

    <h2 class="card__name">Ana García</h2>
    <p class="card__role">Diseñadora UX</p>
    <p class="card__bio">
      Me apasiona crear interfaces simples y accesibles. 5 años de experiencia
      trabajando en productos digitales.
    </p>

    <div class="card__stats">
      <div class="stat">
        <span class="stat__value">24</span>
        <span class="stat__label">Proyectos</span>
      </div>
      <div class="stat">
        <span class="stat__value">1.2k</span>
        <span class="stat__label">Seguidores</span>
      </div>
      <div class="stat">
        <span class="stat__value">4.8</span>
        <span class="stat__label">Valoración</span>
      </div>
    </div>

    <div class="card__actions">
      <button class="btn btn--primary">Seguir</button>
      <button class="btn btn--secondary">Mensaje</button>
    </div>
  </div>

</body>
</html>
